/* ══════════════════════════════════════════
   CSV / 엑셀 내보내기 & 업로드
══════════════════════════════════════════ */
function DataIOPanel({facilities, allItems, showToast}){
  const [uploading, setUploading]=useState(false);
  const [uploadResult, setUploadResult]=useState(null);
  const [selectedFacForUpload, setSelectedFacForUpload]=useState("");
  const [previewRows, setPreviewRows]=useState([]);
  const [showPreview, setShowPreview]=useState(false);
  const fileInputRef=useRef(null);

  /* ── 내보내기 ── */
  const exportCSV=(targetFac)=>{
    const items = targetFac==="all"
      ? Object.values(allItems).flat()
      : (allItems[targetFac]||[]);

    if(items.length===0){showToast("내보낼 데이터가 없습니다.","error");return;}

    const facName=targetFac==="all"?"전체":facilities.find(f=>f.id===targetFac)?.name||targetFac;
    const rows=items.map(item=>({
      "시설코드":item.facilityCode||"",
      "시설명":facilities.find(f=>f.id===item.facilityCode)?.name||item.facilityCode||"",
      "접수번호":item.receiptNo||"",
      "물품명":item.itemName||"",
      "카테고리":CATEGORY_MAP[item.category]||item.category||"",
      "습득장소":item.location||"",
      "습득일자":item.foundDate||"",
      "등록자":item.registrar||"",
      "상태":item.status||"",
      "메모":item.memo||"",
      "수령일":item.receivedDate||"",
      "수령인":item.receiverName||"",
      "수령인연락처":item.receiverContact||"",
      "반출담당자":item.handlerName||"",
      "폐기일":item.disposedDate||"",
      "폐기처리자":item.disposedBy||"",
      "폐기사유":item.disposedReason||"",
      "등록일시":item.createdAt?.toDate?item.createdAt.toDate().toLocaleString("ko-KR"):"",
    }));

    const ws=XLSX.utils.json_to_sheet(rows);
    // 컬럼 너비 자동 설정
    const wscols=Object.keys(rows[0]||{}).map(k=>({wch:Math.max(k.length,12)}));
    ws["!cols"]=wscols;
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"분실물목록");
    const dateStr=today().replace(/-/g,"");
    XLSX.writeFile(wb,`분실물_${facName}_${dateStr}.xlsx`);
    showToast(`✅ ${items.length}건 엑셀 파일 다운로드 완료`);
  };

  /* ── 엑셀 파일 파싱 & 미리보기 ── */
  const handleFileSelect=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try {
        const wb=XLSX.read(ev.target.result,{type:"binary"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
        setPreviewRows(rows);
        setShowPreview(true);
      } catch(err){console.error("[시스템]",err);showToast("파일을 읽는 중 오류가 발생했습니다.","error");}
    };
    reader.readAsBinaryString(f);
    e.target.value=""; // reset
  };

  /* ── Firebase 임포트 ── */
  const handleUpload=async()=>{
    if(!selectedFacForUpload){showToast("업로드할 시설을 선택해 주세요.","error");return;}
    if(previewRows.length===0){showToast("업로드할 데이터가 없습니다.","error");return;}
    setUploading(true);
    setUploadResult(null);
    let success=0, fail=0;
    try {
      // 500건씩 배치
      const chunks=[];
      for(let i=0;i<previewRows.length;i+=400) chunks.push(previewRows.slice(i,i+400));
      for(const chunk of chunks){
        const batch=db.batch();
        for(const row of chunk){
          try {
            const docRef=db.collection(facilityCol(selectedFacForUpload)).doc();
            const data={
              facilityCode: selectedFacForUpload,
              receiptNo: String(row["접수번호"]||""),
              itemName: String(row["물품명"]||""),
              category: Object.entries(CATEGORY_MAP).find(([k,v])=>v===(row["카테고리"]||""))?.[0]||"other",
              location: String(row["습득장소"]||row["습득 장소"]||""),
              foundDate: String(row["습득일자"]||row["습득 일자"]||""),
              registrar: String(row["등록자"]||""),
              status: Object.values(STATUS).includes(row["상태"])?row["상태"]:STATUS.HOLDING,
              memo: String(row["메모"]||""),
              imageUrl: "",
              receivedDate: String(row["수령일"]||""),
              receiverName: String(row["수령인"]||""),
              receiverContact: String(row["수령인연락처"]||""),
              handlerName: String(row["반출담당자"]||""),
              disposedDate: String(row["폐기일"]||""),
              disposedBy: String(row["폐기처리자"]||""),
              disposedReason: String(row["폐기사유"]||""),
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            };
            batch.set(docRef, data);
            success++;
          } catch(e){ fail++; }
        }
        await batch.commit();
      }
      setUploadResult({success, fail});
      showToast(`✅ ${success}건 업로드 완료${fail>0?` (오류 ${fail}건)`:""}`);
      setShowPreview(false);
      setPreviewRows([]);
    } catch(err){console.error("[시스템]",err);showToast("업로드 중 오류가 발생했습니다.","error");}
    finally{setUploading(false);}
  };

  const totalItems=Object.values(allItems).flat().length;

  return(
    <div className="space-y-5 fade-in">
      {/* 내보내기 섹션 */}
      <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-5 py-3 bg-gov-800 text-white flex items-center gap-2 header-accent">
          <Icon name="Download" size={16} className="text-brand-400"/>
          <p className="font-extrabold text-sm">데이터 내보내기 (엑셀 다운로드)</p>
        </div>
        <div className="p-5 space-y-4">
          <div className="bg-gov-50 border border-gov-200 rounded p-4 text-sm text-gov-700">
            <p className="font-bold flex items-center gap-1.5 mb-2"><Icon name="Info" size={14} className="text-gov-500"/> 내보내기 안내</p>
            <ul className="text-xs space-y-1 text-gov-600 list-disc pl-4">
              <li>물품명, 카테고리, 습득장소, 상태, 수령/폐기 정보 등 전체 컬럼 포함</li>
              <li>엑셀(.xlsx) 형식으로 다운로드됩니다</li>
              <li>현재 전체 {totalItems}건의 데이터가 저장되어 있습니다</li>
            </ul>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button onClick={()=>exportCSV("all")}
              className="flex items-center justify-center gap-2 py-3 rounded bg-gov-800 text-white font-extrabold text-sm hover:bg-gov-900 shadow transition border-l-4 border-brand-500">
              <Icon name="FileSpreadsheet" size={17} className="text-brand-400"/>
              전체 시설 내보내기 ({totalItems}건)
            </button>
            <div className="space-y-2">
              <p className="text-xs font-bold text-slate-600">시설별 개별 내보내기</p>
              <div className="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto">
                {facilities.map(f=>{
                  const cnt=(allItems[f.id]||[]).length;
                  return(
                    <button key={f.id} onClick={()=>exportCSV(f.id)}
                      className="flex items-center gap-1.5 px-3 py-2 rounded border border-gov-200 text-gov-800 text-xs font-bold hover:bg-gov-50 transition">
                      <Icon name="FileDown" size={13} className="text-gov-500"/>
                      <span className="truncate">{f.name||f.id}</span>
                      <span className="ml-auto text-slate-400 shrink-0">{cnt}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* 업로드 섹션 */}
      <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-5 py-3 bg-gov-700 text-white flex items-center gap-2">
          <Icon name="Upload" size={16} className="text-brand-400"/>
          <p className="font-extrabold text-sm">데이터 업로드 (엑셀 → Firebase)</p>
        </div>
        <div className="p-5 space-y-4">
          <div className="bg-amber-50 border border-amber-300 rounded p-4">
            <p className="text-xs font-bold text-amber-800 flex items-center gap-1.5 mb-2"><Icon name="AlertTriangle" size={14} className="text-amber-600"/> 업로드 규칙 및 주의사항</p>
            <ul className="text-xs text-amber-700 space-y-1 list-disc pl-4">
              <li><strong>내보내기 파일 형식 그대로</strong> 사용하거나, 아래 컬럼명을 맞춰 주세요</li>
              <li>필수: <code className="bg-amber-100 px-1 rounded">물품명</code>, <code className="bg-amber-100 px-1 rounded">습득장소</code> (없으면 빈칸 처리)</li>
              <li>기존 데이터와 중복 체크 없이 추가됩니다 (접수번호 중복 주의)</li>
              <li>이미지는 업로드되지 않으며, 상태 컬럼은 "보관중/수령완료/폐기처리" 중 하나</li>
            </ul>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-bold text-slate-700 mb-1.5">업로드 대상 시설 <span className="text-red-500">*</span></label>
              <select value={selectedFacForUpload} onChange={e=>setSelectedFacForUpload(e.target.value)}
                className="w-full border border-slate-300 rounded px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-400 bg-white">
                <option value="">시설 선택...</option>
                {facilities.map(f=><option key={f.id} value={f.id}>{f.name||f.id} ({f.id})</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-bold text-slate-700 mb-1.5">엑셀 파일 선택 (.xlsx, .xls, .csv)</label>
              <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv"
                onChange={handleFileSelect}
                className="w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white"/>
            </div>
          </div>
          {/* 미리보기 */}
          {showPreview&&previewRows.length>0&&(
            <div className="border border-slate-200 rounded overflow-hidden fade-in">
              <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <p className="text-sm font-extrabold text-slate-700">미리보기 ({previewRows.length}건, 최대 5행 표시)</p>
                <button onClick={()=>{setShowPreview(false);setPreviewRows([]);}} className="text-xs text-slate-400 hover:text-slate-600">✕ 취소</button>
              </div>
              <div className="overflow-x-auto max-h-52">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-gov-50">
                      {Object.keys(previewRows[0]||{}).slice(0,8).map(k=>(
                        <th key={k} className="px-3 py-2 text-left font-bold text-gov-700 whitespace-nowrap border-b border-slate-200">{k}</th>
                      ))}
                      {Object.keys(previewRows[0]||{}).length>8&&<th className="px-3 py-2 text-left font-bold text-slate-400 border-b border-slate-200">...</th>}
                    </tr>
                  </thead>
                  <tbody>
                    {previewRows.slice(0,5).map((row,i)=>(
                      <tr key={i} className="border-b border-slate-100 hover:bg-slate-50">
                        {Object.values(row).slice(0,8).map((v,j)=>(
                          <td key={j} className="px-3 py-2 text-slate-600 whitespace-nowrap max-w-[120px] truncate">{String(v)}</td>
                        ))}
                        {Object.values(row).length>8&&<td className="px-3 py-2 text-slate-400">...</td>}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="px-4 py-3 bg-white border-t border-slate-100 flex items-center gap-3">
                {selectedFacForUpload?(
                  <button onClick={handleUpload} disabled={uploading}
                    className="flex items-center gap-2 px-5 py-2.5 rounded bg-gov-800 text-white font-extrabold text-sm hover:bg-gov-900 disabled:opacity-60 shadow transition">
                    {uploading?<><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/> 업로드 중...</>
                      :<><Icon name="Upload" size={15} className="text-white"/> {previewRows.length}건 Firebase에 업로드</>}
                  </button>
                ):(
                  <p className="text-sm text-red-500 font-bold">⚠️ 업로드 대상 시설을 먼저 선택해 주세요</p>
                )}
                <span className="text-xs text-slate-400">대상: {selectedFacForUpload?facilities.find(f=>f.id===selectedFacForUpload)?.name||selectedFacForUpload:"미선택"}</span>
              </div>
            </div>
          )}
          {uploadResult&&(
            <div className="bg-emerald-50 border border-emerald-200 rounded px-4 py-3 flex items-center gap-3 fade-in">
              <Icon name="CheckCircle" size={20} className="text-emerald-600 shrink-0"/>
              <div>
                <p className="text-sm font-extrabold text-emerald-800">업로드 완료</p>
                <p className="text-xs text-emerald-600">성공 {uploadResult.success}건{uploadResult.fail>0?` / 실패 ${uploadResult.fail}건`:""}</p>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   메인 어드민 대시보드
══════════════════════════════════════════ */
function AdminDashboard({onLogout}){
  const [facilities,setFacilities]=useState([]);
  const [loading,setLoading]=useState(true);
  const [allItems,setAllItems]=useState({});
  const [loadingItems,setLoadingItems]=useState(false);
  const [showCreate,setShowCreate]=useState(false);
  const [editFacility,setEditFacility]=useState(null);
  const [detailFacility,setDetailFacility]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const [deleting,setDeleting]=useState(false);
  const [qrFacility,setQrFacility]=useState(null);
  const [filterFacility,setFilterFacility]=useState("all");
  const [toast,setToast]=useState({msg:"",type:""});
  const [activeTab,setActiveTab]=useState("realtime");

  const showToast=(msg,type="success")=>{
    setToast({msg,type});
    setTimeout(()=>setToast({msg:"",type:""}),3500);
  };

  useEffect(()=>{
    const unsub=db.collection(FACILITIES_COL).orderBy("createdAt","asc")
      .onSnapshot(snap=>{setFacilities(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
      err=>{console.error("[시스템]",err);showToast("데이터를 불러오는 중 오류가 발생했습니다.","error");setLoading(false);});
    return()=>unsub();
  },[]);

  // allItems를 통계/내보내기/전체현황 탭에서 공통 사용
  useEffect(()=>{
    if(activeTab==="facilities"||activeTab==="realtime") return;
    if(facilities.length===0){setLoadingItems(false);return;}
    setLoadingItems(true);
    const unsubList=[];
    const newItems={};
    let resolved=0;
    const total=facilities.length;
    facilities.forEach(f=>{
      const unsub=db.collection(facilityCol(f.id)).orderBy("createdAt","desc")
        .onSnapshot(snap=>{
          newItems[f.id]=snap.docs.map(d=>({id:d.id,...d.data()}));
          resolved++;
          if(resolved>=total){setAllItems({...newItems});setLoadingItems(false);}
        },()=>{resolved++;if(resolved>=total){setAllItems({...newItems});setLoadingItems(false);}});
      unsubList.push(unsub);
    });
    return()=>unsubList.forEach(u=>u());
  },[activeTab,facilities.length]);

  const handleDelete=async(facility)=>{
    setDeleting(true);
    try {
      const itemSnap=await db.collection(facilityCol(facility.id)).limit(500).get();
      if(!itemSnap.empty){const batch=db.batch();itemSnap.docs.forEach(d=>batch.delete(d.ref));await batch.commit();}
      await db.collection(FACILITIES_COL).doc(facility.id).delete();
      showToast(`시설 "${facility.name}" 삭제 완료`); setConfirmDel(null);
    } catch(err){console.error("[시스템]",err);showToast("삭제 처리 중 오류가 발생했습니다.","error");}
    finally{setDeleting(false);}
  };

  const aggrStats=useMemo(()=>{
    const result={};
    Object.entries(allItems).forEach(([fc,items])=>{
      result[fc]={
        total:items.length,
        holding:items.filter(i=>i.status===STATUS.HOLDING).length,
        completed:items.filter(i=>i.status===STATUS.COMPLETED).length,
        disposed:items.filter(i=>i.status===STATUS.DISPOSED).length,
        overdue:items.filter(i=>i.status===STATUS.HOLDING&&getAgeLevel(calcElapsedDays(i))>=1).length,
      };
    });
    return result;
  },[allItems]);

  const grandTotal=useMemo(()=>{
    const r={total:0,holding:0,completed:0,disposed:0,overdue:0};
    Object.values(aggrStats).forEach(s=>Object.keys(r).forEach(k=>r[k]+=(s[k]||0)));
    return r;
  },[aggrStats]);

  const overviewItems=useMemo(()=>{
    if(filterFacility==="all") return Object.values(allItems).flat();
    return allItems[filterFacility]||[];
  },[allItems,filterFacility]);

  const existingCodes=facilities.map(f=>f.id);

  const TABS=[
    {id:"realtime",label:"실시간 현황",icon:"Radio"},
    {id:"facilities",label:"시설 관리",icon:"Building2"},
    {id:"overview",label:"전체 현황",icon:"List"},
    {id:"stats",label:"통계 대시보드",icon:"BarChart3"},
    {id:"dataio",label:"엑셀 내보내기/업로드",icon:"FileSpreadsheet"},
  ];

  return(
    <div className="min-h-screen bg-[#f4f6fa]">
      {/* 헤더 */}
      <header className="bg-gov-800 text-white sticky top-0 z-30 shadow-md header-accent">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-9 h-9 bg-brand-500 rounded flex items-center justify-center shrink-0">
              <Icon name="ShieldCheck" size={20} className="text-white"/>
            </div>
            <div className="min-w-0">
              <h1 className="font-extrabold text-base leading-tight">전체 관리자 대시보드</h1>
              <p className="text-gov-300 text-xs">분실물 통합 관리 시스템 — Super Admin</p>
            </div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <a href="lost_and_found.html" className="flex items-center gap-1.5 px-3 py-2 rounded bg-gov-700 text-white text-sm font-bold hover:bg-gov-600 border border-gov-600 transition">
              <Icon name="ArrowLeft" size={15} className="text-white"/>
              <span className="hidden sm:inline">시설 게이트</span>
            </a>
            <button onClick={onLogout}
              className="flex items-center gap-1.5 px-3 py-2 rounded bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition">
              <Icon name="LogOut" size={15} className="text-white"/>
              <span className="hidden sm:inline">로그아웃</span>
            </button>
          </div>
        </div>
        {/* 탭 */}
        <div className="max-w-7xl mx-auto px-4 pb-0">
          <div className="flex gap-1 border-b border-gov-700 overflow-x-auto">
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setActiveTab(t.id)}
                className={`flex items-center gap-1.5 px-4 py-2.5 text-sm font-bold border-b-2 transition whitespace-nowrap ${activeTab===t.id?"border-brand-400 text-white":"border-transparent text-gov-300 hover:text-white"}`}>
                <Icon name={t.icon} size={14}/> {t.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-5 space-y-5">

        {/* ── 탭: 실시간 현황 ── */}
        {activeTab==="realtime"&&(
          <RealtimePanel facilities={facilities}/>
        )}

        {/* ── 탭: 시설 관리 ── */}
        {activeTab==="facilities"&&(
          <>
            <div className="flex items-center justify-between gap-3">
              <div><h2 className="text-lg font-extrabold text-slate-800">시설 목록</h2><p className="text-xs text-slate-500 mt-0.5">총 {facilities.length}개 시설 등록됨</p></div>
              <button onClick={()=>setShowCreate(true)}
                className="flex items-center gap-2 px-4 py-2.5 bg-gov-800 text-white rounded font-extrabold text-sm hover:bg-gov-900 shadow transition border-l-4 border-brand-500">
                <Icon name="Plus" size={16} className="text-white"/> 새 시설 등록
              </button>
            </div>
            {loading?<Spinner/>:facilities.length===0?(
              <div className="flex flex-col items-center py-20 text-slate-400 bg-white rounded border border-slate-200">
                <Icon name="Building2" size={48} className="text-slate-300 mb-3"/>
                <p className="font-bold text-slate-500">등록된 시설이 없습니다</p>
                <button onClick={()=>setShowCreate(true)} className="mt-4 px-5 py-2.5 bg-gov-800 text-white rounded font-bold text-sm hover:bg-gov-900">첫 시설 등록하기</button>
              </div>
            ):(
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {facilities.map(f=>(
                  <div key={f.id} className={`bg-white rounded border-2 shadow-sm facility-card ${f.active===false?"border-slate-200 opacity-60":"border-slate-200 hover:border-gov-300"}`}>
                    <div className="flex items-center justify-between px-4 py-3 border-b border-slate-100">
                      <div className="flex items-center gap-2.5 min-w-0">
                        <div className={`w-9 h-9 rounded flex items-center justify-center shrink-0 ${f.active===false?"bg-slate-300":"bg-gov-800"}`}>
                          <Icon name="Building2" size={18} className="text-white"/>
                        </div>
                        <div className="min-w-0">
                          <p className="font-extrabold text-slate-800 truncate">{f.name||"-"}</p>
                          <p className="text-xs text-gov-600 font-mono font-bold">{f.id}</p>
                        </div>
                      </div>
                      <span className={`text-xs font-bold px-2 py-0.5 rounded-full shrink-0 ${f.active===false?"bg-slate-100 text-slate-500":"bg-emerald-100 text-emerald-700"}`}>
                        {f.active===false?"비활성":"활성"}
                      </span>
                    </div>
                    <div className="px-4 py-3 space-y-2">
                      {f.alias?.length>0&&(
                        <div className="flex flex-wrap gap-1">
                          {f.alias.map((a,i)=><span key={i} className="text-xs bg-brand-100 text-brand-700 font-semibold px-2 py-0.5 rounded">{a}</span>)}
                        </div>
                      )}
                      <div className="bg-gov-50 rounded px-3 py-2 flex items-center gap-2 border border-gov-100">
                        <Icon name="KeyRound" size={13} className="text-gov-500"/>
                        <div className="flex-1 min-w-0"><p className="text-xs text-slate-400">입장 코드</p><p className="text-sm font-extrabold text-gov-800 font-mono">{f.id}</p></div>
                        <button onClick={()=>{navigator.clipboard?.writeText(f.id);showToast("코드 복사됨");}} className="p-1.5 hover:bg-slate-200 rounded text-slate-400"><Icon name="Copy" size={13}/></button>
                      </div>
                      <p className="text-xs text-slate-400">등록일: {f.createdAt?.toDate?formatDate(f.createdAt.toDate().toISOString().slice(0,10)):"-"}</p>
                    </div>
                    <div className="px-4 py-3 border-t border-slate-100 flex items-center gap-2">
                      <button onClick={()=>setDetailFacility(f)} className="flex-1 py-2 rounded bg-gov-800 text-white text-xs font-bold hover:bg-gov-900 flex items-center justify-center gap-1.5 transition">
                        <Icon name="Eye" size={13} className="text-white"/> 물품 현황
                      </button>
                      <button onClick={()=>setQrFacility(f)}
                        className="py-2 px-3 rounded border border-brand-300 text-brand-700 text-xs font-bold hover:bg-brand-50 flex items-center gap-1 transition has-tooltip" title="이용객 QR 생성">
                        <Icon name="QrCode" size={13}/>
                      </button>
                      <button onClick={()=>setEditFacility(f)} className="py-2 px-3 rounded border border-slate-300 text-slate-600 text-xs font-bold hover:bg-slate-50 flex items-center gap-1.5 transition">
                        <Icon name="Pencil" size={13}/>
                      </button>
                      <span className="has-tooltip">
                        <button onClick={()=>setConfirmDel(f)} className="py-2 px-3 rounded border border-red-200 text-red-500 text-xs font-bold hover:bg-red-50 flex items-center gap-1.5 transition">
                          <Icon name="Trash2" size={13}/>
                        </button>
                        <span className="tooltip-box">⚠️ 시설 및 전체 물품 데이터 삭제</span>
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        {/* ── 탭: 전체 현황 ── */}
        {activeTab==="overview"&&(
          <>
            <div className="bg-gov-800 rounded p-5 text-white shadow border-l-4 border-brand-500">
              <p className="text-gov-300 text-sm font-bold mb-3 flex items-center gap-2"><Icon name="BarChart3" size={16} className="text-gov-400"/> 전체 시설 통합 현황</p>
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                {[
                  {label:"전체 물품",value:grandTotal.total,color:"text-white"},
                  {label:"보관중",value:grandTotal.holding,color:"text-blue-300"},
                  {label:"수령완료",value:grandTotal.completed,color:"text-emerald-300"},
                  {label:"기간 경과",value:grandTotal.overdue,color:"text-yellow-300"},
                  {label:"폐기처리",value:grandTotal.disposed,color:"text-slate-400"},
                ].map(c=>(
                  <div key={c.label} className="bg-white/10 rounded p-3 text-center">
                    <p className={`text-2xl font-extrabold ${c.color}`}>{c.value}</p>
                    <p className="text-gov-300 text-xs mt-0.5">{c.label}</p>
                  </div>
                ))}
              </div>
            </div>
            <div className="flex gap-2 overflow-x-auto pb-1">
              <button onClick={()=>setFilterFacility("all")}
                className={`shrink-0 px-3 py-1.5 rounded text-xs font-bold border transition ${filterFacility==="all"?"bg-gov-800 text-white border-gov-800":"bg-white text-slate-600 border-slate-200 hover:border-gov-300"}`}>
                전체 ({facilities.length}개 시설)
              </button>
              {facilities.map(f=>(
                <button key={f.id} onClick={()=>setFilterFacility(f.id)}
                  className={`shrink-0 px-3 py-1.5 rounded text-xs font-bold border transition ${filterFacility===f.id?"bg-gov-800 text-white border-gov-800":"bg-white text-slate-600 border-slate-200 hover:border-gov-300"}`}>
                  {f.name||f.id}
                </button>
              ))}
            </div>
            {loadingItems?<Spinner/>:(
              <>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {(filterFacility==="all"?facilities:facilities.filter(f=>f.id===filterFacility)).map(f=>{
                    const s=aggrStats[f.id]||{total:0,holding:0,completed:0,disposed:0,overdue:0};
                    return(
                      <div key={f.id} className="bg-white rounded border border-slate-200 shadow-sm hover:shadow transition overflow-hidden">
                        <div className="flex items-center gap-3 px-4 py-3 bg-gov-50 border-b border-gov-100 border-l-4 border-l-gov-700">
                          <div className="w-8 h-8 bg-gov-800 rounded flex items-center justify-center shrink-0"><Icon name="Building2" size={16} className="text-white"/></div>
                          <div className="min-w-0 flex-1"><p className="font-extrabold text-gov-900 truncate">{f.name||f.id}</p><p className="text-xs text-gov-600 font-mono">{f.id}</p></div>
                          <button onClick={()=>setDetailFacility(f)} className="px-2.5 py-1.5 rounded bg-gov-800 text-white text-xs font-bold hover:bg-gov-900 flex items-center gap-1 shrink-0">
                            <Icon name="Eye" size={11} className="text-white"/> 상세
                          </button>
                        </div>
                        <div className="grid grid-cols-4 gap-0 p-3">
                          {[{label:"전체",value:s.total,color:"text-gov-800"},{label:"보관중",value:s.holding,color:"text-blue-700"},{label:"수령완료",value:s.completed,color:"text-emerald-700"},{label:"폐기",value:s.disposed,color:"text-slate-500"}].map(c=>(
                            <div key={c.label} className="text-center py-2"><p className={`text-lg font-extrabold ${c.color}`}>{c.value}</p><p className="text-xs text-slate-400">{c.label}</p></div>
                          ))}
                        </div>
                        {s.overdue>0&&(
                          <div className="mx-3 mb-3 bg-amber-50 border border-amber-200 rounded px-3 py-2 flex items-center gap-1.5">
                            <Icon name="Clock" size={13} className="text-amber-500"/>
                            <p className="text-xs font-bold text-amber-700">기간 경과 {s.overdue}건</p>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
                {overviewItems.length>0&&(
                  <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
                    <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                      <p className="font-extrabold text-slate-800">
                        {filterFacility==="all"?"전체 물품 목록":`${facilities.find(f=>f.id===filterFacility)?.name||filterFacility} 물품`}
                        <span className="ml-2 text-sm font-normal text-slate-400">{overviewItems.length}건</span>
                      </p>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full data-table">
                        <thead>
                          <tr>
                            <th className="py-2.5 px-3 text-left">시설</th>
                            <th className="py-2.5 px-3 text-left hidden sm:table-cell">접수번호</th>
                            <th className="py-2.5 px-3 text-left">물품명</th>
                            <th className="py-2.5 px-3 text-left hidden md:table-cell">장소</th>
                            <th className="py-2.5 px-3 text-left hidden lg:table-cell">습득일</th>
                            <th className="py-2.5 px-3 text-left">상태</th>
                          </tr>
                        </thead>
                        <tbody>
                          {overviewItems.slice(0,200).map(item=>{
                            const fac=facilities.find(f=>f.id===item.facilityCode)||{name:item.facilityCode||"-"};
                            const days=calcElapsedDays(item);
                            const lv=item.status===STATUS.HOLDING?getAgeLevel(days):0;
                            const rowCls=lv===4?"bg-pink-50":lv===3?"bg-red-50":lv===2?"bg-orange-50":lv===1?"bg-yellow-50":"";
                            return(
                              <tr key={item.id} className={`border-b border-slate-100 hover:bg-slate-50 transition ${rowCls}`}>
                                <td className="py-2 px-3 text-xs font-bold text-gov-700 whitespace-nowrap">{fac.name}</td>
                                <td className="py-2 px-3 text-xs font-bold text-slate-500 hidden sm:table-cell">{item.receiptNo||"-"}</td>
                                <td className="py-2 px-3 text-sm font-bold text-slate-800">{item.itemName}</td>
                                <td className="py-2 px-3 text-xs text-slate-500 hidden md:table-cell">{item.location}</td>
                                <td className="py-2 px-3 text-xs text-slate-500 hidden lg:table-cell">{formatDate(item.foundDate)}</td>
                                <td className="py-2 px-3"><Badge status={item.status}/></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                      {overviewItems.length>200&&<p className="text-center text-xs text-slate-400 py-3">처음 200건만 표시 (전체 {overviewItems.length}건)</p>}
                    </div>
                  </div>
                )}
              </>
            )}
          </>
        )}

        {/* ── 탭: 통계 대시보드 ── */}
        {activeTab==="stats"&&(
          loadingItems?<Spinner/>:<StatsCharts facilities={facilities} allItems={allItems}/>
        )}

        {/* ── 탭: 엑셀 내보내기/업로드 ── */}
        {activeTab==="dataio"&&(
          loadingItems?<Spinner/>:<DataIOPanel facilities={facilities} allItems={allItems} showToast={showToast}/>
        )}

      </main>

      {/* 모달들 */}
      {showCreate&&<CreateFacilityModal onClose={()=>setShowCreate(false)} onCreated={()=>setShowCreate(false)} showToast={showToast} existingCodes={existingCodes}/>}
      {editFacility&&<EditFacilityModal facility={editFacility} onClose={()=>setEditFacility(null)} onSaved={()=>setEditFacility(null)} showToast={showToast}/>}
      {detailFacility&&<FacilityDetailPanel facility={detailFacility} onClose={()=>setDetailFacility(null)}/>}
      {qrFacility&&<GuestQRModal facility={qrFacility} onClose={()=>setQrFacility(null)}/>}
      {confirmDel&&(
        <div className="modal-overlay" onClick={()=>setConfirmDel(null)}>
          <div className="modal-box max-w-sm" onClick={e=>e.stopPropagation()}>
            <div className="p-6 text-center space-y-4">
              <div className="w-16 h-16 bg-red-100 rounded flex items-center justify-center mx-auto"><Icon name="Trash2" size={32} className="text-red-500"/></div>
              <div>
                <h3 className="text-lg font-extrabold text-slate-800">시설 삭제 확인</h3>
                <p className="text-sm text-slate-500 mt-2"><strong className="text-red-600">{confirmDel.name}</strong> 시설과 모든 물품 데이터가 영구 삭제됩니다.</p>
                <p className="text-xs text-red-500 mt-1 font-bold">⚠️ 이 작업은 되돌릴 수 없습니다.</p>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <button onClick={()=>setConfirmDel(null)} className="py-3 rounded border border-slate-300 text-slate-600 font-bold text-sm hover:bg-slate-50">취소</button>
                <button onClick={()=>handleDelete(confirmDel)} disabled={deleting}
                  className="py-3 rounded bg-red-600 text-white font-extrabold text-sm hover:bg-red-700 disabled:opacity-60 flex items-center justify-center gap-2">
                  {deleting?<><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/> 삭제 중...</>:<><Icon name="Trash2" size={15} className="text-white"/> 삭제 확정</>}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

/* ══════════════════════════════════════════
   루트 앱
══════════════════════════════════════════ */
function AdminApp(){
  const [auth,setAuth]=useState(()=>sessionStorage.getItem("adminAuth")==="1");
  const [sessionWarning,setSessionWarning]=useState(false);

  // Phase 3: 세션 경고 콜백 연결
  React.useEffect(()=>{
    window._showSessionWarning = () => setSessionWarning(true);
    return () => { window._showSessionWarning = null; };
  },[]);

  const handleLogin=()=>{ sessionStorage.setItem("adminAuth","1"); setAuth(true); };
  const handleLogout=()=>{
    // Phase 3: 로그아웃 시 세션·타이머 완전 파기
    if(_sessionTimer) clearTimeout(_sessionTimer);
    if(_warningTimer) clearTimeout(_warningTimer);
    sessionStorage.clear();
    setAuth(false);
    setSessionWarning(false);
  };

  if(!auth) return <AdminLogin onLogin={handleLogin}/>;
  return(
    <>
      {/* Phase 3: 세션 만료 경고 배너 */}
      {sessionWarning && (
        <div className="fixed top-0 left-0 right-0 z-[9999] bg-amber-500 text-white text-center py-2 px-4 text-sm font-bold shadow-lg animate-pulse">
          ⏰ 관리자 세션이 곧 만료됩니다 (약 {SESSION_WARNING_MIN}분 남음). 계속 사용하시려면 화면을 클릭하세요.
        </div>
      )}
      <AdminDashboard onLogout={handleLogout}/>
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<AdminApp/>);
</script>
</body>
</html>
