<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ══════════════════════════════════════════
   Firebase 설정
══════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyD8dO860fhZoEVZdFruou32HtHfkZVOGCM",
  authDomain:        "opsmaster-3fbf9.firebaseapp.com",
  projectId:         "opsmaster-3fbf9",
  storageBucket:     "opsmaster-3fbf9.firebasestorage.app",
  messagingSenderId: "453123301113",
  appId:             "1:453123301113:web:e9e6d0e1169789766b4c28",
  measurementId:     "G-YKELC63WT5"
};
const RAW_APP_ID = firebaseConfig.appId || "lost-and-found";
const APP_ID     = RAW_APP_ID.replace(/[^a-zA-Z0-9_-]/g,"_");
/* ── 관리자 코드 보안: SHA-256 해시 비교 방식 (원문 비노출) ── */
const ADMIN_HASH = "4d8365e1bfd24389fc3fdfcefe89f8880d04924ce518ddb6611a472e70200514";
async function sha256Async(str) {
  if (window.crypto && window.crypto.subtle) {
    const encoded = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', encoded);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  if (window.CryptoJS) {
    return CryptoJS.SHA256(str).toString();
  }
  console.error('[보안] SHA-256 해시 생성 불가');
  return '';
}
async function verifyAdminCode(input) {
  const hash = await sha256Async(input.trim().toUpperCase());
  return hash === ADMIN_HASH;
}
/* ── 로그인 시도 횟수 제한 (5회 실패 시 30초 잠금) ── */
const LOGIN_MAX_ATTEMPTS = 5;
const LOGIN_LOCKOUT_SEC = 30;
function getLoginState() {
  const raw = sessionStorage.getItem('_admin_login_state');
  if (!raw) return { attempts: 0, lockedUntil: 0 };
  try { return JSON.parse(raw); } catch { return { attempts: 0, lockedUntil: 0 }; }
}
function setLoginState(state) {
  sessionStorage.setItem('_admin_login_state', JSON.stringify(state));
}
function isLoginLocked() {
  const s = getLoginState();
  if (s.lockedUntil && Date.now() < s.lockedUntil) return true;
  if (s.lockedUntil && Date.now() >= s.lockedUntil) { setLoginState({ attempts: 0, lockedUntil: 0 }); }
  return false;
}
function recordLoginAttempt(success) {
  if (success) { setLoginState({ attempts: 0, lockedUntil: 0 }); return; }
  const s = getLoginState();
  const next = s.attempts + 1;
  if (next >= LOGIN_MAX_ATTEMPTS) {
    setLoginState({ attempts: next, lockedUntil: Date.now() + LOGIN_LOCKOUT_SEC * 1000 });
  } else {
    setLoginState({ attempts: next, lockedUntil: 0 });
  }
}
/* ── Phase 2: 입력 데이터 정제(Sanitize) — XSS 방지 ── */
function sanitizeInput(str, maxLen = 200) {
  return String(str || "")
    .replace(/<[^>]*>/g, '')
    .replace(/[<>&"']/g, '')
    .trim()
    .slice(0, maxLen);
}
const BASE_PATH  = `artifacts/${APP_ID}/public/data`;
const FACILITIES_COL = `${BASE_PATH}/facilities`;
const facilityCol    = (fc) => `${BASE_PATH}/facilities/${fc}/lost_items`;
// 로그 컬렉션 (index.html 과 동일 경로)
const VISIT_LOGS_COL    = `${BASE_PATH}/visit_logs`;
const ACTIVITY_LOGS_COL = `${BASE_PATH}/activity_logs`;

let db;
try { firebase.app(); } catch(e) { firebase.initializeApp(firebaseConfig); }
db = firebase.firestore();

/* ── 세션 ID (브라우저 탭당 고유) ── */
function getSessionId(){
  let sid=sessionStorage.getItem("_sid");
  if(!sid){ sid=Date.now().toString(36)+Math.random().toString(36).slice(2,7); sessionStorage.setItem("_sid",sid); }
  return sid;
}

/* ══════════════════════════════════════════
   Phase 3: 세션 타임아웃 (안전성 확보조치 기준 제5조 제5항)
   — 관리자: 20분 미조작 시 자동 로그아웃
   — 만료 5분 전 경고 알림
══════════════════════════════════════════ */
const SESSION_TIMEOUT_MIN  = 20;  // 관리자 세션 (분) — 일반 담당자보다 짧음
const SESSION_WARNING_MIN  = 5;   // 만료 전 경고 시간 (분)
let _sessionTimer = null;
let _warningTimer = null;
let _sessionWarningShown = false;

function resetSessionTimer() {
  if (_sessionTimer) clearTimeout(_sessionTimer);
  if (_warningTimer) clearTimeout(_warningTimer);
  _sessionWarningShown = false;

  _warningTimer = setTimeout(() => {
    _sessionWarningShown = true;
    if (window._showSessionWarning) window._showSessionWarning();
  }, (SESSION_TIMEOUT_MIN - SESSION_WARNING_MIN) * 60 * 1000);

  _sessionTimer = setTimeout(() => {
    sessionStorage.clear();
    alert("⏰ 장시간 미사용으로 자동 로그아웃되었습니다.\n\n(개인정보보호를 위해 " + SESSION_TIMEOUT_MIN + "분 미조작 시 자동 차단됩니다)");
    window.location.reload();
  }, SESSION_TIMEOUT_MIN * 60 * 1000);
}

function startSessionMonitor() {
  const events = ['click','keydown','mousemove','scroll','touchstart'];
  events.forEach(evt => document.addEventListener(evt, () => {
    resetSessionTimer();
  }, { passive: true }));
  resetSessionTimer();
}

/* ══════════════════════════════════════════
   Phase 3: 감사 로그 강화 (안전성 확보조치 기준 제8조)
══════════════════════════════════════════ */
async function logAudit(action, details) {
  try {
    await db.collection(`${BASE_PATH}/audit_logs`).add({
      action,
      details,
      sessionId: getSessionId(),
      source: 'admin_dashboard',
      actedAt: firebase.firestore.FieldValue.serverTimestamp(),
      dateStr: new Date().toISOString().slice(0, 10),
    });
  } catch(e) { console.error('[감사로그]', e); }
}

/* ══════════════════════════════════════════
   유틸
══════════════════════════════════════════ */
const STATUS = { HOLDING:"보관중", COMPLETED:"수령완료", DISPOSED:"폐기처리" };
const CATEGORIES = [
  {value:"swimming",label:"수영용품"},{value:"shower",label:"샤워용품"},
  {value:"electronics",label:"전자기기"},{value:"clothing",label:"의류/모자"},
  {value:"wallet",label:"지갑/가방"},{value:"keys",label:"열쇠/카드"},
  {value:"glasses",label:"안경/선글라스"},{value:"umbrella",label:"우산"},
  {value:"jewelry",label:"귀중품/액세서리"},{value:"other",label:"기타"},
];
const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c=>[c.value,c.label]));

function formatDate(s){
  if(!s) return "-";
  const d=new Date(s);
  if(isNaN(d)) return s;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function calcElapsedDays(item){
  const base=item.foundDate||(item.createdAt?.toDate?item.createdAt.toDate().toISOString().slice(0,10):null);
  if(!base) return 0;
  return Math.floor((Date.now()-new Date(base).getTime())/(86400000));
}
function getAgeLevel(days){
  if(days>=120) return 4; if(days>=90) return 3;
  if(days>=60) return 2;  if(days>=30) return 1;
  return 0;
}

/* ══════════════════════════════════════════
   공통 UI
══════════════════════════════════════════ */
function Icon({name,size=18,className=""}){
  const el=lucide[name]||lucide["HelpCircle"];
  const svg=lucide.createElement(el);
  svg.setAttribute("width",size); svg.setAttribute("height",size);
  return <span className={className} dangerouslySetInnerHTML={{__html:svg.outerHTML}}/>;
}
function Spinner(){return(<div className="flex justify-center py-12"><div className="w-8 h-8 border-4 border-gov-100 border-t-gov-700 rounded-full animate-spin"/></div>);}
function Toast({msg,type}){
  if(!msg) return null;
  const bg=type==="error"?"bg-red-600":"bg-gov-800";
  return(
    <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] ${bg} text-white px-5 py-3 rounded shadow-xl text-sm font-semibold fade-in flex items-center gap-2 max-w-sm`}>
      <Icon name={type==="error"?"AlertCircle":"CheckCircle"} size={16} className="text-white shrink-0"/>
      <span>{msg}</span>
    </div>
  );
}
function Badge({status}){
  const cls=status===STATUS.COMPLETED?"status-completed":status===STATUS.DISPOSED?"status-disposed":"status-holding";
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold ${cls}`}>{status}</span>;
}

/* ══════════════════════════════════════════
   이용객 QR 모달
══════════════════════════════════════════ */
const VIEW_BASE_URL = (() => {
  const loc = window.location;
  const base = loc.origin + loc.pathname.replace('lost_and_found_admin.html','');
  return base + 'lost_and_found_view.html';
})();

function GuestQRModal({facility, onClose}){
  const qrRef = useRef(null);
  const qrInst = useRef(null);
  const viewUrl = `${VIEW_BASE_URL}?facility=${facility.id}`;

  useEffect(()=>{
    if(!qrRef.current) return;
    qrRef.current.innerHTML = '';
    qrInst.current = new QRCode(qrRef.current, {
      text: viewUrl,
      width: 200, height: 200,
      colorDark: '#1a2b5e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  },[]);

  const handleDownload = () => {
    const canvas = qrRef.current?.querySelector('canvas');
    const img    = qrRef.current?.querySelector('img');
    const src    = canvas ? canvas.toDataURL('image/png') : img?.src;
    if(!src){ alert('QR 이미지를 찾을 수 없습니다.'); return; }
    const a = document.createElement('a');
    a.href = src;
    a.download = `이용객QR_${facility.name||facility.id}.png`;
    a.click();
  };

  const handleCopy = () => {
    navigator.clipboard?.writeText(viewUrl);
    alert('URL이 클립보드에 복사되었습니다.');
  };

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        {/* 헤더 */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 sticky top-0 bg-white z-10">
          <h2 className="font-extrabold text-slate-800 flex items-center gap-2">
            <Icon name="QrCode" size={20} className="text-gov-700"/> 이용객 QR 코드
          </h2>
          <button onClick={onClose} className="p-1.5 hover:bg-slate-100 rounded text-slate-400"><Icon name="X" size={20}/></button>
        </div>
        <div className="p-6 flex flex-col items-center gap-5">
          {/* 시설명 */}
          <div className="w-full bg-gov-50 border border-gov-200 rounded px-4 py-3 flex items-center gap-3">
            <div className="w-9 h-9 bg-gov-800 rounded flex items-center justify-center shrink-0">
              <Icon name="Building2" size={18} className="text-white"/>
            </div>
            <div>
              <p className="text-xs text-slate-400">시설명</p>
              <p className="font-extrabold text-gov-900">{facility.name}</p>
              <p className="text-xs font-mono text-gov-500">{facility.id}</p>
            </div>
          </div>
          {/* QR */}
          <div className="bg-white p-4 rounded-xl border-2 border-gov-200 shadow-inner">
            <div ref={qrRef}/>
          </div>
          {/* URL */}
          <div className="w-full bg-slate-50 border border-slate-200 rounded px-3 py-2.5 flex items-center gap-2">
            <Icon name="Link" size={13} className="text-slate-400 shrink-0"/>
            <p className="text-xs font-mono text-slate-600 truncate flex-1">{viewUrl}</p>
            <button onClick={handleCopy}
              className="px-2.5 py-1 rounded bg-gov-100 text-gov-700 text-xs font-bold hover:bg-gov-200 shrink-0 flex items-center gap-1">
              <Icon name="Copy" size={11}/> 복사
            </button>
          </div>
          {/* 안내 */}
          <div className="w-full bg-brand-50 border border-brand-200 rounded px-4 py-3 text-xs text-slate-600 space-y-1">
            <p className="font-bold text-brand-800 flex items-center gap-1.5 mb-1.5">
              <Icon name="Info" size={13} className="text-brand-500"/> 이용객 QR 안내
            </p>
            <p>• QR 스캔 시 <strong>{facility.name}</strong> 분실물 목록으로 바로 이동</p>
            <p>• <strong>보관중 / 반환완료</strong> 물품만 표시 (폐기 항목 자동 숨김)</p>
            <p>• 이용객은 <strong>조회만</strong> 가능하며 수정·삭제 불가</p>
            <p>• 시설 안내판, 입구 게시판에 부착하세요</p>
          </div>
        </div>
        {/* 푸터 버튼 */}
        <div className="px-5 py-4 border-t border-slate-100 grid grid-cols-2 gap-3 sticky bottom-0 bg-white">
          <button onClick={handleDownload}
            className="py-3 rounded bg-gov-800 text-white font-extrabold text-sm hover:bg-gov-900 flex items-center justify-center gap-2 shadow">
            <Icon name="Download" size={16} className="text-white"/> PNG 저장
          </button>
          <button onClick={()=>window.open(viewUrl,'_blank')}
            className="py-3 rounded border border-gov-300 text-gov-800 font-extrabold text-sm hover:bg-gov-50 flex items-center justify-center gap-2">
            <Icon name="ExternalLink" size={16}/> 미리보기
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   어드민 로그인 게이트
══════════════════════════════════════════ */
function AdminLogin({onLogin}){
  const [code,setCode]=useState("");
  const [error,setError]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{ inputRef.current?.focus(); },[]);

  const handleSubmit=async(e)=>{
    e?.preventDefault();
    /* ── 로그인 시도 횟수 제한 검사 ── */
    if(isLoginLocked()){
      const remain=Math.ceil((getLoginState().lockedUntil-Date.now())/1000);
      setError(`시도 횟수를 초과했습니다. ${remain}초 후 다시 시도해 주세요.`);
      return;
    }
    /* ── SHA-256 해시 비교로 관리자 코드 검증 (원문 비노출) ── */
    const isAdmin=await verifyAdminCode(code.trim());
    if(isAdmin){
      recordLoginAttempt(true);
      // 관리자 접속 로그 기록
      try { await db.collection(ACTIVITY_LOGS_COL).add({
        type:"admin_login", detail:{method:"admin_gate"},
        actedAt:firebase.firestore.FieldValue.serverTimestamp(),
        dateStr:new Date().toISOString().slice(0,10),
      }); } catch(e){}
      startSessionMonitor(); // Phase 3: 관리자 세션 타임아웃 시작
      onLogin();
    } else {
      recordLoginAttempt(false);
      const s=getLoginState();
      const remaining=LOGIN_MAX_ATTEMPTS-s.attempts;
      setError(remaining>0?`관리자 코드가 올바르지 않습니다. (${remaining}회 남음)`:"시도 횟수를 초과했습니다.");
      setCode("");
      inputRef.current?.focus();
    }
  };

  return(
    <div className="gate-bg flex flex-col items-center justify-center min-h-screen px-4 py-10">
      <div className="flex flex-col items-center mb-8 fade-in">
        <div className="w-20 h-20 bg-gov-800 rounded flex items-center justify-center mb-4 border-2 border-brand-500 shadow-md">
          <Icon name="ShieldCheck" size={40} className="text-white"/>
        </div>
        <h1 className="text-gov-900 text-2xl font-extrabold tracking-tight">관리자 대시보드</h1>
        <p className="text-slate-500 text-sm mt-1">Lost &amp; Found — Super Admin</p>

/* ══════════════════════════════════════════
   시설 생성 모달
══════════════════════════════════════════ */
function CreateFacilityModal({onClose,onCreated,showToast,existingCodes}){
  const [name,setName]=useState("");
  const [code,setCode]=useState("");
  const [alias,setAlias]=useState("");
  const [saving,setSaving]=useState(false);
  const refName=useRef(null),refCode=useRef(null),refAlias=useRef(null);
  useEffect(()=>{ refName.current?.focus(); },[]);

  const autoGenCode=()=>{
    const nums=existingCodes.filter(c=>c.match(/^a\d+$/)).map(c=>parseInt(c.slice(1))).filter(n=>!isNaN(n));
    const next=(nums.length>0?Math.max(...nums):0)+1;
    setCode("a"+String(next).padStart(2,"0"));
  };

  const handleSubmit=async(e)=>{
    e?.preventDefault();
    if(!name.trim()){showToast("시설명을 입력해 주세요.","error");return;}
    if(!code.trim()){showToast("시설 코드를 입력해 주세요.","error");return;}
    const codeVal=code.trim().toLowerCase();
    if(existingCodes.includes(codeVal)){showToast("이미 사용 중인 코드입니다.","error");return;}
    setSaving(true);
    try {
      await db.collection(FACILITIES_COL).doc(codeVal).set({
        name:name.trim(), facilityCode:codeVal, accessCode:codeVal,
        alias:alias.trim()?alias.trim().split(/[,，\s]+/).map(a=>a.trim()).filter(Boolean):[],
        createdAt:firebase.firestore.FieldValue.serverTimestamp(), active:true,
      });
      showToast(`✅ 시설 "${name.trim()}" (${codeVal}) 생성 완료`); onCreated();
    } catch(err){console.error("[시스템]",err);showToast("시설 생성 중 오류가 발생했습니다.","error");}
    finally{setSaving(false);}
  };

  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 sticky top-0 bg-white z-10">
          <h2 className="font-extrabold text-slate-800 flex items-center gap-2"><Icon name="PlusCircle" size={20} className="text-gov-700"/> 새 시설 등록</h2>
          <button onClick={onClose} className="p-1.5 hover:bg-slate-100 rounded text-slate-400"><Icon name="X" size={20}/></button>
        </div>
        <form onSubmit={handleSubmit}>
          <div className="p-5 space-y-4">
            <div>
              <label className="block text-sm font-bold text-slate-700 mb-1.5">시설명 <span className="text-red-500">*</span></label>
              <input ref={refName} type="text" value={name} onChange={e=>setName(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();refCode.current?.focus();}}}
                placeholder="예) 가경 수영장, 봉명 스포츠센터"
                className="w-full border border-slate-300 rounded px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-400"/>
            </div>
            <div>
              <label className="block text-sm font-bold text-slate-700 mb-1.5">시설 코드 <span className="text-red-500">*</span><span className="ml-2 text-xs text-slate-400 font-normal">(소문자 영문+숫자, 예: a01)</span></label>
              <div className="flex gap-2">
                <input ref={refCode} type="text" value={code} onChange={e=>setCode(e.target.value.toLowerCase().replace(/[^a-z0-9]/g,""))}
                  onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();refAlias.current?.focus();}}}
                  placeholder="예) a01, a02, gym01"
                  className="flex-1 border border-slate-300 rounded px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-400 font-mono"/>
                <button type="button" onClick={autoGenCode} className="px-3 py-2 rounded bg-gov-100 text-gov-700 text-xs font-bold hover:bg-gov-200 border border-gov-200 whitespace-nowrap">자동 생성</button>
              </div>
            </div>
            <div>
              <label className="block text-sm font-bold text-slate-700 mb-1.5">별칭 <span className="text-slate-400 font-normal">(선택, 쉼표로 구분)</span></label>
              <input ref={refAlias} type="text" value={alias} onChange={e=>setAlias(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();handleSubmit();}}}
                placeholder="예) 가경, 가경수영장 — 이 이름으로도 로그인 가능"
                className="w-full border border-slate-300 rounded px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-400"/>
              <p className="text-xs text-slate-400 mt-1.5">💡 별칭 입력 시 시설 담당자가 코드 대신 별칭으로도 입장 가능합니다.</p>
            </div>

            <button type="button" onClick={onClose} className="py-3 rounded border border-slate-300 text-slate-600 font-bold text-sm hover:bg-slate-50">취소</button>
            <button type="submit" disabled={saving} className="py-3 rounded bg-gov-800 text-white font-extrabold text-sm hover:bg-gov-900 disabled:opacity-60 flex items-center justify-center gap-2 shadow">
              {saving?<><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/> 저장 중...</>:<><Icon name="Save" size={16} className="text-white"/> 시설 등록</>}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function FacilityDetailPanel({facility,onClose}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterStatus,setFilterStatus]=useState("all");
  const [search,setSearch]=useState("");

  useEffect(()=>{
    setLoading(true);
    const unsub=db.collection(facilityCol(facility.id)).orderBy("createdAt","desc")
      .onSnapshot(snap=>{setItems(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},()=>setLoading(false));
    return()=>unsub();
  },[facility.id]);

  const filtered=useMemo(()=>items.filter(item=>{
    const q=search.toLowerCase();
    const matchSearch=!q||item.itemName?.toLowerCase().includes(q)||item.location?.toLowerCase().includes(q)||item.receiptNo?.toLowerCase().includes(q);
    const matchStatus=filterStatus==="all"||(filterStatus==="holding"&&item.status===STATUS.HOLDING)||(filterStatus==="completed"&&item.status===STATUS.COMPLETED)||(filterStatus==="disposed"&&item.status===STATUS.DISPOSED);
    return matchSearch&&matchStatus;
  }),[items,search,filterStatus]);

  const holding=items.filter(i=>i.status===STATUS.HOLDING).length;
  const completed=items.filter(i=>i.status===STATUS.COMPLETED).length;
  const disposed=items.filter(i=>i.status===STATUS.DISPOSED).length;
  const overdue=items.filter(i=>i.status===STATUS.HOLDING&&getAgeLevel(calcElapsedDays(i))>=1).length;

  return(
    <div className="fixed inset-0 z-40 flex" onClick={onClose}>
      <div className="flex-1 bg-black/40"/>
      <div className="w-full max-w-xl bg-white h-full overflow-y-auto shadow-2xl fade-in flex flex-col" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 bg-gov-800 text-white sticky top-0 z-10 header-accent">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-9 h-9 bg-brand-500 rounded flex items-center justify-center shrink-0"><Icon name="Building2" size={18} className="text-white"/></div>
            <div className="min-w-0"><p className="font-extrabold truncate">{facility.name}</p><p className="text-gov-300 text-xs font-mono">{facility.id}</p></div>
          </div>
          <button onClick={onClose} className="p-2 hover:bg-gov-700 rounded"><Icon name="X" size={20} className="text-white"/></button>
        </div>
        <div className="grid grid-cols-4 gap-2 p-4 bg-slate-50 border-b border-slate-200">
          {[{label:"전체",value:items.length,color:"text-gov-800",f:"all"},{label:"보관중",value:holding,color:"text-blue-700",f:"holding"},{label:"수령완료",value:completed,color:"text-emerald-700",f:"completed"},{label:"폐기",value:disposed,color:"text-slate-500",f:"disposed"}].map(c=>(
            <button key={c.f} onClick={()=>setFilterStatus(c.f)}
              className={`rounded p-3 text-center border-2 transition ${filterStatus===c.f?"border-gov-700 bg-white shadow":"border-transparent bg-white hover:border-gov-200"}`}>
              <p className={`text-xl font-extrabold ${c.color}`}>{c.value}</p>
              <p className="text-xs text-slate-500 mt-0.5">{c.label}</p>
            </button>
          ))}
        </div>
        {overdue>0&&(
          <div className="mx-4 mt-3 bg-amber-50 border border-amber-300 rounded px-4 py-2.5 flex items-center gap-2">
            <Icon name="AlertTriangle" size={16} className="text-amber-500 shrink-0"/>
            <p className="text-xs font-bold text-amber-700">기간 경과 물품 <span className="text-amber-900 text-sm">{overdue}건</span> — 폐기 처리 검토 필요</p>
          </div>
        )}
        <div className="px-4 py-3">
          <div className="relative">
            <Icon name="Search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
            <input type="text" value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="물품명, 장소, 접수번호 검색..."
              className="w-full pl-9 pr-4 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-gov-400 bg-white"/>
          </div>
        </div>
        <div className="flex-1 px-4 pb-6">
          {loading?<Spinner/>:filtered.length===0?(
            <div className="flex flex-col items-center py-16 text-slate-400">
              <Icon name="PackageSearch" size={40} className="text-slate-300 mb-2"/>

            </div>
          ):(
            <div className="space-y-2">
              <p className="text-xs text-slate-400 font-semibold px-1 pb-1">{filtered.length}건 표시</p>
              {filtered.map(item=>{
                const days=calcElapsedDays(item);
                const lv=item.status===STATUS.HOLDING?getAgeLevel(days):0;
                const ageCls=lv===4?"text-pink-600":lv===3?"text-red-600":lv===2?"text-orange-600":lv===1?"text-yellow-700":"text-slate-400";
                return(
                  <div key={item.id} className="bg-white rounded border border-slate-200 px-4 py-3 flex items-center gap-3 shadow-sm hover:shadow transition">
                    {item.imageUrl?<img src={item.imageUrl} alt="" className="w-12 h-12 rounded object-cover border border-slate-200 shrink-0" loading="lazy"/>
                      :<div className="w-12 h-12 rounded bg-slate-100 flex items-center justify-center shrink-0"><Icon name="Image" size={18} className="text-slate-300"/></div>}

                      {item.receiptNo&&<p className="text-xs text-gov-600 font-bold">{item.receiptNo}</p>}
                      <p className="text-xs text-slate-500 truncate">{item.location} · {formatDate(item.foundDate)}</p>
                      {lv>0&&<p className={`text-xs font-bold mt-0.5 ${ageCls}`}>{days}일 경과</p>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   실시간 현황 패널
══════════════════════════════════════════ */
function RealtimePanel({facilities}){
  const [activityLogs,setActivityLogs]=useState([]);
  const [visitLogs,setVisitLogs]=useState([]);      // 최근 100건 (화면 표시용)
  const [totalVisitCount,setTotalVisitCount]=useState(null); // 전체 누적 수
  const [loadingA,setLoadingA]=useState(true);
  const [loadingV,setLoadingV]=useState(true);
  const [loadingTotal,setLoadingTotal]=useState(true);
  const [onlineCount,setOnlineCount]=useState(0);

  /* ── 최신 활동 로그 실시간 구독 ── */
  useEffect(()=>{
    const unsub=db.collection(ACTIVITY_LOGS_COL)
      .orderBy("actedAt","desc").limit(30)
      .onSnapshot(snap=>{
        setActivityLogs(snap.docs.map(d=>({id:d.id,...d.data()})));
        setLoadingA(false);
      },()=>setLoadingA(false));
    return()=>unsub();
  },[]);

  /* ── 방문 로그 실시간 구독 (최근 100건, 화면 표시 + 오늘/이달 집계) ── */
  useEffect(()=>{
    const unsub=db.collection(VISIT_LOGS_COL)
      .orderBy("visitedAt","desc").limit(100)
      .onSnapshot(snap=>{
        const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
        setVisitLogs(docs);
        const fiveMinAgo=Date.now()-5*60*1000;
        const onlineSessions=new Set(
          docs.filter(d=>{
            const t=d.visitedAt?.toDate?d.visitedAt.toDate().getTime():0;
            return t>fiveMinAgo;
          }).map(d=>d.sessionId)
        );
        setOnlineCount(onlineSessions.size);
        setLoadingV(false);
      },()=>setLoadingV(false));
    return()=>unsub();
  },[]);

  /* ── 전체 누적 접속 수: Firestore count() 집계 (주기적 폴링 30초) ── */
  useEffect(()=>{
    let cancelled=false;
    async function fetchTotal(){
      try {
        // Firestore count() 집계 쿼리 (Firebase JS SDK v9 compat 방식)
        const snap=await db.collection(VISIT_LOGS_COL).get();
        if(!cancelled) setTotalVisitCount(snap.size);
      } catch(e){
        // count() 미지원 환경 대비: 문서 수로 fallback
        try {
          const snap=await db.collection(VISIT_LOGS_COL).get();
          if(!cancelled) setTotalVisitCount(snap.size);
        } catch(e2){ if(!cancelled) setTotalVisitCount(null); }
      } finally { if(!cancelled) setLoadingTotal(false); }
    }
    fetchTotal();
    const interval=setInterval(fetchTotal, 30000); // 30초마다 갱신
    return()=>{ cancelled=true; clearInterval(interval); };
  },[]);

  /* ── 오늘 방문 / 이번 달 방문 집계 ── */
  const todayStr=new Date().toISOString().slice(0,10);
  const thisMonthStr=new Date().toISOString().slice(0,7);
  const todayVisits=visitLogs.filter(v=>v.dateStr===todayStr).length;
  const monthVisits=visitLogs.filter(v=>v.dateStr?.startsWith(thisMonthStr)).length;

  /* ── 오늘 등록 분실물 수 ── */
  const todayRegistered=activityLogs.filter(a=>a.type==="register"&&a.dateStr===todayStr).length;

  /* ── 전체 누적 표시 문자 ── */
  const totalLabel=loadingTotal?"...":totalVisitCount!==null?totalVisitCount.toLocaleString():"-";

  /* ── 상대 시간 표시 ── */
  function relTime(ts){
    if(!ts?.toDate) return "-";
    const diff=Math.floor((Date.now()-ts.toDate().getTime())/1000);
    if(diff<60) return `${diff}초 전`;
    if(diff<3600) return `${Math.floor(diff/60)}분 전`;
    if(diff<86400) return `${Math.floor(diff/3600)}시간 전`;
    return `${Math.floor(diff/86400)}일 전`;
  }

  /* ── 활동 타입 아이콘/라벨/색 ── */
  function actTypeInfo(type){
    if(type==="register") return {icon:"PlusCircle",label:"신규 등록",color:"text-gov-700",bg:"bg-gov-50"};
    if(type==="complete") return {icon:"CheckCircle",label:"수령 완료",color:"text-emerald-700",bg:"bg-emerald-50"};
    if(type==="dispose")  return {icon:"Archive",label:"폐기 처리",color:"text-slate-500",bg:"bg-slate-100"};
    if(type==="delete")   return {icon:"Trash2",label:"삭제",color:"text-red-600",bg:"bg-red-50"};
    return {icon:"Activity",label:type,color:"text-slate-500",bg:"bg-slate-100"};
  }

  return(
    <div className="space-y-5 fade-in">

      {/* ── 카운터 카드 5개 (2+3 레이아웃) ── */}
      {/* 첫 행: 현재 온라인 + 전체 누적 접속 */}
      <div className="grid grid-cols-2 gap-4">
        {/* 현재 온라인 */}
        <div className="bg-white rounded border-2 border-emerald-300 shadow-sm p-4 flex items-center gap-3">
          <div className="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center shrink-0 shadow-md">
            <Icon name="Wifi" size={24} className="text-white"/>
          </div>
          <div>
            <p className="text-3xl font-extrabold text-emerald-700 leading-tight">{onlineCount}</p>
            <p className="text-xs text-slate-500 font-semibold mt-0.5">현재 온라인</p>
            <p className="text-[10px] text-slate-400">최근 5분 이내 접속</p>
          </div>
        </div>
        {/* 전체 누적 접속 수 */}
        <div className="bg-white rounded border-2 border-gov-300 shadow-sm p-4 flex items-center gap-3">
          <div className="w-12 h-12 bg-gov-800 rounded-full flex items-center justify-center shrink-0 shadow-md">
            <Icon name="DatabaseZap" size={24} className="text-white"/>
          </div>
          <div>
            <p className="text-3xl font-extrabold text-gov-800 leading-tight">{totalLabel}</p>
            <p className="text-xs text-slate-500 font-semibold mt-0.5">전체 누적 접속</p>
            <p className="text-[10px] text-slate-400">서비스 오픈 이후 합계</p>
          </div>
        </div>
      </div>
      {/* 두 번째 행: 오늘 방문 + 이번 달 방문 + 오늘 등록 */}
      <div className="grid grid-cols-3 gap-4">
        {/* 오늘 방문 */}
        <div className="bg-white rounded border border-slate-200 shadow-sm p-4 flex items-center gap-3">
          <div className="w-11 h-11 bg-brand-500 rounded-full flex items-center justify-center shrink-0 shadow-md">
            <Icon name="UserCheck" size={22} className="text-white"/>
          </div>
          <div>
            <p className="text-2xl font-extrabold text-brand-600">{todayVisits}</p>
            <p className="text-xs text-slate-500 font-semibold mt-0.5">오늘 방문</p>
            <p className="text-[10px] text-slate-400">{todayStr}</p>
          </div>
        </div>
        {/* 이번 달 방문 */}
        <div className="bg-white rounded border border-slate-200 shadow-sm p-4 flex items-center gap-3">
          <div className="w-11 h-11 bg-gov-600 rounded-full flex items-center justify-center shrink-0 shadow-md">
            <Icon name="CalendarDays" size={22} className="text-white"/>
          </div>
          <div>
            <p className="text-2xl font-extrabold text-gov-700">{monthVisits}</p>
            <p className="text-xs text-slate-500 font-semibold mt-0.5">이번 달 방문</p>
            <p className="text-[10px] text-slate-400">{thisMonthStr}</p>
          </div>
        </div>
        {/* 오늘 등록 물품 */}
        <div className="bg-white rounded border border-slate-200 shadow-sm p-4 flex items-center gap-3">
          <div className="w-11 h-11 bg-blue-600 rounded-full flex items-center justify-center shrink-0 shadow-md">
            <Icon name="PackagePlus" size={22} className="text-white"/>
          </div>
          <div>
            <p className="text-2xl font-extrabold text-blue-700">{todayRegistered}</p>
            <p className="text-xs text-slate-500 font-semibold mt-0.5">오늘 등록 물품</p>
            <p className="text-[10px] text-slate-400">신규 분실물 접수</p>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">

        {/* ── 최근 활동 로그 ── */}
        <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
          <div className="flex items-center gap-2 px-4 py-3 bg-gov-800 text-white header-accent">
            <div className="w-6 h-6 bg-brand-500 rounded flex items-center justify-center shrink-0">
              <Icon name="Activity" size={13} className="text-white"/>
            </div>
            <p className="font-extrabold text-sm">최근 활동 로그</p>
            <span className="ml-auto bg-white/20 text-white text-xs font-bold px-2 py-0.5 rounded-full">실시간</span>
          </div>
          {loadingA?(
            <div className="flex justify-center py-10"><div className="w-6 h-6 border-4 border-gov-100 border-t-gov-700 rounded-full animate-spin"/></div>
          ):activityLogs.length===0?(
            <div className="flex flex-col items-center py-14 text-slate-400 gap-2">
              <Icon name="InboxIcon" size={36} className="text-slate-300"/>
              <p className="text-sm font-semibold">아직 활동 기록이 없습니다</p>
              <p className="text-xs text-slate-300">분실물이 등록되면 여기에 표시됩니다</p>
            </div>
          ):(
            <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto">
              {activityLogs.map(log=>{
                const info=actTypeInfo(log.type);
                return(
                  <div key={log.id} className="flex items-start gap-3 px-4 py-3 hover:bg-slate-50 transition">
                    <div className={`w-7 h-7 ${info.bg} rounded-full flex items-center justify-center shrink-0 mt-0.5`}>
                      <Icon name={info.icon} size={13} className={info.color}/>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className={`text-xs font-extrabold ${info.color}`}>{info.label}</span>
                        <span className="text-xs font-bold text-gov-700 bg-gov-50 px-1.5 py-0.5 rounded">
                          {log.facilityName||log.facilityCode}
                        </span>
                      </div>
                      {log.detail&&(
                        <p className="text-xs text-slate-700 font-semibold mt-0.5 truncate">
                          {log.detail.receiptNo&&<span className="text-gov-500 mr-1">{log.detail.receiptNo}</span>}
                          {log.detail.itemName}
                          {log.detail.location&&<span className="text-slate-400"> · {log.detail.location}</span>}
                        </p>
                      )}
                      {log.detail?.registrar&&<p className="text-[11px] text-slate-400 mt-0.5">등록자: {log.detail.registrar}</p>}
                    </div>
                    <span className="text-[10px] text-slate-400 shrink-0 whitespace-nowrap">{relTime(log.actedAt)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── 최근 접속 로그 ── */}
        <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
          <div className="flex items-center gap-2 px-4 py-3 bg-gov-700 text-white">
            <div className="w-6 h-6 bg-brand-500 rounded flex items-center justify-center shrink-0">
              <Icon name="LogIn" size={13} className="text-white"/>
            </div>
            <p className="font-extrabold text-sm">최근 접속 기록</p>
            <span className="ml-auto bg-white/20 text-white text-xs font-bold px-2 py-0.5 rounded-full">최근 50건</span>
          </div>
          {loadingV?(
            <div className="flex justify-center py-10"><div className="w-6 h-6 border-4 border-gov-100 border-t-gov-700 rounded-full animate-spin"/></div>
          ):visitLogs.length===0?(
            <div className="flex flex-col items-center py-14 text-slate-400 gap-2">
              <Icon name="UsersRound" size={36} className="text-slate-300"/>
              <p className="text-sm font-semibold">아직 접속 기록이 없습니다</p>
              <p className="text-xs text-slate-300">시설 담당자가 로그인하면 표시됩니다</p>
            </div>
          ):(
            <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto">
              {visitLogs.map(log=>{
                const fiveMinAgo=Date.now()-5*60*1000;
                const isOnline=log.visitedAt?.toDate&&log.visitedAt.toDate().getTime()>fiveMinAgo;
                return(
                  <div key={log.id} className="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 transition">
                    <div className="relative shrink-0">
                      <div className="w-8 h-8 bg-gov-100 rounded-full flex items-center justify-center">
                        <Icon name="Building2" size={15} className="text-gov-600"/>
                      </div>
                      {isOnline&&(
                        <span className="absolute -top-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white"/>
                      )}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-bold text-slate-700 truncate">
                          {log.facilityName||log.facilityCode}
                        </span>
                        {isOnline&&<span className="text-[10px] font-extrabold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-full shrink-0">● 온라인</span>}
                      </div>
                      <p className="text-xs text-slate-400 font-mono mt-0.5">{log.facilityCode}</p>
                    </div>
                    <span className="text-[10px] text-slate-400 shrink-0 whitespace-nowrap">{relTime(log.visitedAt)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* ── 시설별 오늘 활동 요약 ── */}
      {facilities.length>0&&(
        <div className="bg-white rounded border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
            <Icon name="LayoutGrid" size={15} className="text-gov-600"/>
            <p className="font-extrabold text-gov-900 text-sm">시설별 오늘 활동 요약</p>
            <span className="ml-auto text-xs text-slate-400">{todayStr}</span>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full data-table">
              <thead>
                <tr>
                  <th className="py-2.5 px-4 text-left">시설명</th>
                  <th className="py-2.5 px-3 text-center">오늘 접속</th>
                  <th className="py-2.5 px-3 text-center">오늘 등록</th>
                  <th className="py-2.5 px-3 text-center">마지막 접속</th>
                </tr>
              </thead>
              <tbody>
                {facilities.map(f=>{
                  const todayV=visitLogs.filter(v=>v.facilityCode===f.id&&v.dateStr===todayStr).length;
                  const todayR=activityLogs.filter(a=>a.facilityCode===f.id&&a.type==="register"&&a.dateStr===todayStr).length;
                  const lastVisit=visitLogs.find(v=>v.facilityCode===f.id);
                  return(
                    <tr key={f.id} className="border-b border-slate-100 hover:bg-slate-50 transition">
                      <td className="py-2.5 px-4 text-sm font-bold text-gov-800">
                        {f.name} <span className="text-xs font-mono text-slate-400 ml-1">{f.id}</span>
                      </td>
                      <td className="py-2.5 px-3 text-center">
                        <span className={`font-extrabold text-sm ${todayV>0?"text-brand-600":"text-slate-300"}`}>{todayV}</span>
                      </td>
                      <td className="py-2.5 px-3 text-center">
                        <span className={`font-extrabold text-sm ${todayR>0?"text-gov-700":"text-slate-300"}`}>{todayR}</span>
                      </td>
                      <td className="py-2.5 px-3 text-center text-xs text-slate-400">
                        {lastVisit?relTime(lastVisit.visitedAt):"-"}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   통계 차트 컴포넌트 (Chart.js)
══════════════════════════════════════════ */
function StatsCharts({facilities, allItems}){
  const barRef=useRef(null), pieRef=useRef(null), lineRef=useRef(null), hbarRef=useRef(null);
  const barChart=useRef(null), pieChart=useRef(null), lineChart=useRef(null), hbarChart=useRef(null);

  const stats=useMemo(()=>{
    // 시설별 집계
    const facilityStats=facilities.map(f=>{
      const items=allItems[f.id]||[];
      const thisMonth=new Date(); thisMonth.setDate(1); thisMonth.setHours(0,0,0,0);
      const thisMonthItems=items.filter(i=>{
        const d=i.createdAt?.toDate?i.createdAt.toDate():new Date(i.foundDate||0);
        return d>=thisMonth;
      });
      return {
        name: f.name||f.id, code: f.id,
        total: items.length,
        holding: items.filter(i=>i.status===STATUS.HOLDING).length,
        completed: items.filter(i=>i.status===STATUS.COMPLETED).length,
        disposed: items.filter(i=>i.status===STATUS.DISPOSED).length,
        overdue: items.filter(i=>i.status===STATUS.HOLDING&&getAgeLevel(calcElapsedDays(i))>=1).length,
        thisMonth: thisMonthItems.length,
      };
    });

    // Top5 (이번 달 기준)
    const top5Month=[...facilityStats].sort((a,b)=>b.thisMonth-a.thisMonth).slice(0,5);
    // Top5 (전체 기준)
    const top5Total=[...facilityStats].sort((a,b)=>b.total-a.total).slice(0,5);

    // 월별 등록 추이 (최근 6개월)
    const monthlyData={};
    const now=new Date();
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}`;
      monthlyData[key]=0;
    }
    Object.values(allItems).flat().forEach(item=>{
      const d=item.createdAt?.toDate?item.createdAt.toDate():new Date(item.foundDate||0);
      const key=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}`;
      if(monthlyData[key]!==undefined) monthlyData[key]++;
    });

    // 카테고리별 집계
    const catMap={};
    CATEGORIES.forEach(c=>catMap[c.label]=0);
    Object.values(allItems).flat().forEach(item=>{
      const label=CATEGORY_MAP[item.category]||"기타";
      if(catMap[label]!==undefined) catMap[label]++;
      else catMap["기타"]=(catMap["기타"]||0)+1;
    });

    return { facilityStats, top5Month, top5Total, monthlyData, catMap };
  },[facilities, allItems]);

  useEffect(()=>{
    // 1. 이번 달 Top5 가로 막대
    if(hbarRef.current){
      if(hbarChart.current) hbarChart.current.destroy();
      const d=stats.top5Month;
      hbarChart.current=new Chart(hbarRef.current,{
        type:'bar',
        data:{
          labels:d.map(f=>f.name),
          datasets:[{
            label:'이번 달 등록 건수',
            data:d.map(f=>f.thisMonth),
            backgroundColor:['#1a2b5e','#233c7d','#2d4a94','#3a5caa','#5577bc'],
            borderRadius:3,
          }]
        },
        options:{
          indexAxis:'y',
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.parsed.x}건`}}},
          scales:{x:{grid:{color:'#eef1f8'},ticks:{color:'#666',font:{size:11}}},y:{grid:{display:false},ticks:{color:'#1a2b5e',font:{size:12,weight:'bold'}}}}
        }
      });
    }
    // 2. 전체 시설별 현황 막대
    if(barRef.current){
      if(barChart.current) barChart.current.destroy();
      const d=stats.top5Total;
      barChart.current=new Chart(barRef.current,{
        type:'bar',
        data:{
          labels:d.map(f=>f.name),
          datasets:[
            {label:'보관중', data:d.map(f=>f.holding), backgroundColor:'#3a5caa', borderRadius:2},
            {label:'수령완료', data:d.map(f=>f.completed), backgroundColor:'#22c55e', borderRadius:2},
            {label:'폐기처리', data:d.map(f=>f.disposed), backgroundColor:'#94a3b8', borderRadius:2},
          ]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}},tooltip:{mode:'index'}},
          scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#1a2b5e',font:{size:11,weight:'bold'}}},y:{stacked:true,grid:{color:'#eef1f8'},ticks:{color:'#666',font:{size:11}}}}
        }
      });
    }
    // 3. 월별 추이 라인
    if(lineRef.current){
      if(lineChart.current) lineChart.current.destroy();
      lineChart.current=new Chart(lineRef.current,{
        type:'line',
        data:{
          labels:Object.keys(stats.monthlyData),
          datasets:[{
            label:'월 등록 건수',
            data:Object.values(stats.monthlyData),
            borderColor:'#f06a21', backgroundColor:'rgba(240,106,33,0.1)',
            borderWidth:2.5, pointBackgroundColor:'#f06a21', pointRadius:5, fill:true, tension:0.3
          }]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.parsed.y}건`}}},
          scales:{x:{grid:{display:false},ticks:{color:'#666',font:{size:11}}},y:{grid:{color:'#eef1f8'},ticks:{color:'#666',font:{size:11}}}}
        }
      });
    }
    // 4. 카테고리 도넛
    if(pieRef.current){
      if(pieChart.current) pieChart.current.destroy();
      const labels=Object.keys(stats.catMap).filter(k=>stats.catMap[k]>0);
      const data=labels.map(k=>stats.catMap[k]);
      const colors=['#1a2b5e','#f06a21','#22c55e','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#6b7280'];
      pieChart.current=new Chart(pieRef.current,{
        type:'doughnut',
        data:{labels, datasets:[{data, backgroundColor:colors.slice(0,labels.length), borderWidth:1, borderColor:'#fff'}]},
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.parsed}건`}}}
        }
      });
    }
    return()=>{
      hbarChart.current?.destroy(); barChart.current?.destroy();
      lineChart.current?.destroy(); pieChart.current?.destroy();
    };
  },[stats]);

  const grandTotal=useMemo(()=>{
    const r={total:0,holding:0,completed:0,disposed:0,overdue:0,thisMonth:0};
    stats.facilityStats.forEach(s=>Object.keys(r).forEach(k=>r[k]+=(s[k]||0)));
    return r;
  },[stats]);

  return(
    <div className="space-y-5 fade-in">
      {/* 전체 요약 */}
      <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
        {[
          {label:"전체 물품",value:grandTotal.total,color:"text-gov-800",bg:"bg-gov-50",border:"border-gov-200"},
          {label:"보관중",value:grandTotal.holding,color:"text-blue-700",bg:"bg-blue-50",border:"border-blue-200"},
          {label:"수령완료",value:grandTotal.completed,color:"text-emerald-700",bg:"bg-emerald-50",border:"border-emerald-200"},
          {label:"기간경과",value:grandTotal.overdue,color:"text-brand-600",bg:"bg-brand-50",border:"border-brand-200"},
          {label:"폐기처리",value:grandTotal.disposed,color:"text-slate-500",bg:"bg-slate-50",border:"border-slate-200"},
        ].map(c=>(
          <div key={c.label} className={`${c.bg} border ${c.border} rounded p-4 text-center`}>
            <p className={`text-2xl font-extrabold ${c.color}`}>{c.value}</p>
            <p className="text-xs text-slate-500 mt-0.5 font-semibold">{c.label}</p>
          </div>
        ))}
      </div>

      {/* 차트 그리드 */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        {/* 이번 달 Top5 */}
        <div className="bg-white rounded border border-slate-200 shadow-sm p-4">
          <div className="flex items-center gap-2 mb-3">
            <div className="w-7 h-7 bg-brand-500 rounded flex items-center justify-center"><Icon name="TrendingUp" size={14} className="text-white"/></div>
            <div>
              <p className="font-extrabold text-gov-900 text-sm">이번 달 분실물 Top 5 시설</p>
              <p className="text-xs text-slate-400">{new Date().getFullYear()}년 {new Date().getMonth()+1}월 기준</p>
            </div>
          </div>
          <div className="chart-container" style={{height:"200px"}}>
            <canvas ref={hbarRef}/>
          </div>
          {stats.top5Month.every(f=>f.thisMonth===0)&&(
            <p className="text-center text-xs text-slate-400 mt-2">이번 달 등록된 물품이 없습니다</p>
