function Dashboard({facilityCode,facilityName,onLogout}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [filterStatus,setFilterStatus]=useState("all");
  const [filterCat,setFilterCat]=useState("all");
  const [filterAge,setFilterAge]=useState("all");
  const [viewMode,setViewMode]=useState("gallery");
  const [showReg,setShowReg]=useState(false);
  const [selected,setSelected]=useState(null);
  const [selectMode,setSelectMode]=useState(false);
  const [selectedIds,setSelectedIds]=useState(new Set());
  const [showDisposal,setShowDisposal]=useState(false);
  const [showDeleteBulk,setShowDeleteBulk]=useState(false);
  const [toast,setToast]=useState({msg:"",type:""});

  const showToast=(msg,type="success")=>{
    setToast({msg,type});
    setTimeout(()=>setToast({msg:"",type:""}),3000);
  };

  useEffect(()=>{
    setLoading(true);
    const unsub=db.collection(facilityCol(facilityCode))
      .orderBy("createdAt","desc")
      .onSnapshot(snap=>{
        setItems(snap.docs.map(d=>({id:d.id,...d.data()})));
        setLoading(false);
      },err=>{showToast("데이터 로드 오류: "+err.message,"error");setLoading(false);});
    return()=>unsub();
  },[facilityCode]);

  const filtered=useMemo(()=>items.filter(item=>{
    const q=search.toLowerCase();
    const matchSearch=!q||item.itemName?.toLowerCase().includes(q)||item.location?.toLowerCase().includes(q)||item.registrar?.toLowerCase().includes(q)||item.receiptNo?.toLowerCase().includes(q);
    const matchStatus=filterStatus==="all"||(filterStatus==="holding"&&item.status===STATUS.HOLDING)||(filterStatus==="completed"&&item.status===STATUS.COMPLETED)||(filterStatus==="disposed"&&item.status===STATUS.DISPOSED);
    const matchCat=filterCat==="all"||item.category===filterCat;
    const days=calcElapsedDays(item),lv=getAgeLevel(days);
    const matchAge=filterAge==="all"||(filterAge==="1m"&&lv===1)||(filterAge==="2m"&&lv===2)||(filterAge==="3m"&&lv===3)||(filterAge==="4m"&&lv===4)||(filterAge==="overdue"&&lv>=1);
    return matchSearch&&matchStatus&&matchCat&&matchAge;
  }),[items,search,filterStatus,filterCat,filterAge]);

  const totalCount=items.length;
  const holdingCount=items.filter(i=>i.status===STATUS.HOLDING).length;
  const completedCount=items.filter(i=>i.status===STATUS.COMPLETED).length;
  const disposedCount=items.filter(i=>i.status===STATUS.DISPOSED).length;
  const overdueCount=items.filter(i=>i.status===STATUS.HOLDING&&getAgeLevel(calcElapsedDays(i))>=1).length;
  const age3pCount=items.filter(i=>i.status===STATUS.HOLDING&&getAgeLevel(calcElapsedDays(i))>=3).length;

  const toggleSelectMode=()=>{ setSelectMode(p=>!p); setSelectedIds(new Set()); };
  const toggleId=id=>setSelectedIds(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const selectAll=()=>setSelectedIds(new Set(filtered.map(i=>i.id)));
  const clearSelection=()=>setSelectedIds(new Set());
  const selectedItems=filtered.filter(i=>selectedIds.has(i.id));
  const resetFilters=()=>{setSearch("");setFilterStatus("all");setFilterCat("all");setFilterAge("all");};

  const SummaryCard=({label,value,sub,color,onClick,active})=>(
    <button onClick={onClick} className={`rounded p-4 text-left transition border summary-card ${active?"active border-gov-800 bg-gov-50":"border-slate-200 bg-white"}`}>
      <p className={`text-2xl font-extrabold ${color||"text-gov-900"}`}>{value}</p>
      <p className="text-xs font-bold text-slate-500 mt-0.5">{label}</p>
      {sub&&<p className="text-xs text-slate-400 mt-0.5">{sub}</p>}
    </button>
  );

  return(
    <div className="min-h-screen bg-[#f4f6fa]">
      {/* 헤더 */}
      <header className="bg-gov-800 text-white sticky top-0 z-30 shadow-md header-accent">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-8 h-8 bg-brand-500 rounded flex items-center justify-center shrink-0">
              <Icon name="Package" size={18} className="text-white"/>
            </div>
            <div className="min-w-0">
              <h1 className="font-extrabold text-base leading-tight truncate">분실물 통합 관리</h1>
              <p className="text-gov-300 text-xs flex items-center gap-1"><Icon name="Building2" size={11} className="text-brand-400"/> {facilityName||facilityCode} 시설</p>
            </div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={toggleSelectMode} className={`flex items-center gap-1.5 px-3 py-1.5 rounded font-bold text-sm transition ${selectMode?"bg-red-600 text-white hover:bg-red-700":"bg-brand-500 text-white hover:bg-brand-600"}`}>
              <Icon name={selectMode?"X":"CheckSquare"} size={14} className="text-white"/>
              <span className="hidden sm:inline">{selectMode?"선택 취소":"선택/폐기"}</span>
            </button>
            <button onClick={()=>setShowReg(true)} className="flex items-center gap-1.5 px-3 py-1.5 bg-white text-gov-900 rounded font-extrabold text-sm hover:bg-gov-50 transition">
              <Icon name="Plus" size={14} className="text-gov-800"/> <span className="hidden sm:inline">신규 등록</span>
            </button>
            <button onClick={()=>{localStorage.removeItem("facilityCode");localStorage.removeItem("facilityName");onLogout();}} title="로그아웃" className="p-1.5 hover:bg-gov-800 rounded transition">
              <Icon name="LogOut" size={16} className="text-white"/>
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-5 space-y-4">
        {/* 요약 카드 */}
        <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
          <SummaryCard label="전체" value={totalCount} color="text-gov-800" onClick={()=>setFilterStatus("all")} active={filterStatus==="all"&&filterAge==="all"}/>
          <SummaryCard label="보관중" value={holdingCount} color="text-gov-700" onClick={()=>{setFilterStatus("holding");setFilterAge("all");}} active={filterStatus==="holding"&&filterAge==="all"}/>
          <SummaryCard label="수령완료" value={completedCount} color="text-emerald-700" onClick={()=>{setFilterStatus("completed");setFilterAge("all");}} active={filterStatus==="completed"}/>
          <SummaryCard label="기간경과⚠️" value={overdueCount} color="text-brand-600" onClick={()=>{setFilterStatus("all");setFilterAge("overdue");}} active={filterAge==="overdue"}/>
          <SummaryCard label="3개월↑🔴" value={age3pCount} color="text-red-600" onClick={()=>{setFilterStatus("all");setFilterAge("3m");}} active={filterAge==="3m"}/>
          <SummaryCard label="폐기처리" value={disposedCount} color="text-slate-400" onClick={()=>{setFilterStatus("disposed");setFilterAge("all");}} active={filterStatus==="disposed"}/>
        </div>

        {/* 검색 & 뷰 */}
        <div className="flex gap-2 flex-wrap">
          <div className="relative flex-1 min-w-48">
            <Icon name="Search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"/>
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="물품명, 장소, 등록자, 접수번호 검색..." className="w-full pl-9 pr-4 py-2 border border-slate-300 rounded text-sm field-input bg-white"/>
          </div>
          <div className="flex items-center gap-1 bg-white border border-slate-200 rounded px-1 py-1">
            <button onClick={()=>setViewMode("gallery")} title="갤러리 뷰" className={`p-1.5 rounded ${viewMode==="gallery"?"bg-gov-800 text-white":"text-slate-400 hover:bg-slate-100"}`}><Icon name="LayoutGrid" size={15}/></button>
            <button onClick={()=>setViewMode("list")} title="리스트 뷰" className={`p-1.5 rounded ${viewMode==="list"?"bg-gov-800 text-white":"text-slate-400 hover:bg-slate-100"}`}><Icon name="List" size={15}/></button>
          </div>
        </div>

        {/* 카테고리 필터 */}
        <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
          <button onClick={()=>setFilterCat("all")} className={`shrink-0 px-3 py-1.5 rounded text-xs font-bold border transition ${filterCat==="all"?"bg-gov-800 text-white border-gov-800":"bg-white text-slate-600 border-slate-200 hover:border-gov-500"}`}>전체</button>
          {CATEGORIES.map(c=>(
            <button key={c.value} onClick={()=>setFilterCat(c.value)} className={`shrink-0 px-3 py-1.5 rounded text-xs font-bold border transition ${filterCat===c.value?"bg-gov-800 text-white border-gov-800":"bg-white text-slate-600 border-slate-200 hover:border-gov-500"}`}>{c.label}</button>
          ))}
        </div>

        {/* 선택 모드 액션 바 */}
        {selectMode&&(
          <div className="bg-gov-50 border-2 border-gov-300 rounded p-3 flex items-center gap-3 flex-wrap fade-in">
            <div className="flex items-center gap-2">
              <Icon name="CheckSquare" size={16} className="text-gov-700"/>
              <span className="text-sm font-extrabold text-gov-800">{selectedIds.size}건 선택됨</span>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={selectAll} className="px-3 py-1.5 text-xs font-bold bg-white border border-slate-300 rounded text-slate-600 hover:bg-slate-50">전체 선택 ({filtered.length})</button>
              <button onClick={clearSelection} className="px-3 py-1.5 text-xs font-bold bg-white border border-slate-300 rounded text-slate-600 hover:bg-slate-50">선택 해제</button>
            </div>
            <div className="flex items-center gap-2 ml-auto flex-wrap">
              <span className="has-tooltip tooltip-right">
                <button onClick={()=>selectedIds.size>0?setShowDisposal(true):showToast("폐기할 항목을 선택해 주세요.","error")} disabled={selectedIds.size===0} className="flex items-center gap-1.5 px-3 py-1.5 bg-brand-500 text-white rounded text-sm font-bold hover:bg-brand-600 disabled:opacity-50">
                  <Icon name="Archive" size={14} className="text-white"/> 폐기 처리 ({selectedIds.size})
                </button>
                <span className="tooltip-box">📦 <strong>폐기 처리 (이력 보존)</strong><br/>상태 변경, 데이터는 DB에 남습니다.</span>
              </span>
              <span className="has-tooltip tooltip-right">
                <button onClick={()=>selectedIds.size>0?setShowDeleteBulk(true):showToast("삭제할 항목을 선택해 주세요.","error")} disabled={selectedIds.size===0} className="flex items-center gap-1.5 px-3 py-1.5 bg-red-600 text-white rounded text-sm font-bold hover:bg-red-700 disabled:opacity-50">
                  <Icon name="Trash2" size={14} className="text-white"/> 완전 삭제 ({selectedIds.size})
                </button>
                <span className="tooltip-box">🗑️ <strong>완전 삭제 (DB 영구 제거)</strong><br/>복구 불가, 신중하게 사용하세요.</span>
              </span>
            </div>
          </div>
        )}

        {/* 결과 수 */}
        <div className="flex items-center justify-between px-1">
          <p className="text-sm text-slate-500">{filtered.length>0?<><span className="font-extrabold text-slate-800">{filtered.length}</span>건 표시 중</>:<span className="text-slate-400">표시할 항목 없음</span>}</p>
          {(search||filterStatus!=="all"||filterCat!=="all"||filterAge!=="all")&&(

          <div className="flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded border border-slate-200">
            <Icon name="PackageSearch" size={48} className="text-slate-300 mb-3"/>
            <p className="font-bold text-slate-500">표시할 항목이 없습니다</p>
            {(search||filterStatus!=="all"||filterCat!=="all"||filterAge!=="all")&&<button onClick={resetFilters} className="mt-3 text-sm text-gov-600 font-bold hover:underline">필터 초기화</button>}
          </div>
        ):viewMode==="gallery"?(
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
            {filtered.map(item=><ItemCard key={item.id} item={item} onClick={setSelected} selectMode={selectMode} selected={selectedIds.has(item.id)} onSelect={toggleId}/>)}
          </div>
        ):(
          <div className="bg-white rounded border border-slate-200 overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full data-table">
                <thead>
                  <tr className="border-b border-slate-200 text-left">
                    <th className="py-3 px-3 text-xs font-extrabold text-gov-700 uppercase w-14">{selectMode?"✓":"사진"}</th>
                    <th className="py-3 px-2 text-xs font-extrabold text-gov-700 uppercase hidden sm:table-cell">접수번호</th>
                    <th className="py-3 px-2 text-xs font-extrabold text-gov-700 uppercase">물품명</th>
                    <th className="py-3 px-2 text-xs font-extrabold text-gov-700 uppercase hidden md:table-cell">장소</th>
                    <th className="py-3 px-2 text-xs font-extrabold text-gov-700 uppercase hidden lg:table-cell">습득일</th>
                    <th className="py-3 px-2 text-xs font-extrabold text-gov-700 uppercase hidden xl:table-cell">등록자</th>
                    <th className="py-3 px-3 text-xs font-extrabold text-gov-700 uppercase">상태</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(item=><ItemRow key={item.id} item={item} onClick={setSelected} selectMode={selectMode} selected={selectedIds.has(item.id)} onSelect={toggleId}/>)}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </main>

      {showReg&&<RegisterModal facilityCode={facilityCode} facilityName={facilityName} onClose={()=>setShowReg(false)} onSaved={()=>setShowReg(false)} showToast={showToast}/>}
      {selected&&<DetailModal item={selected} facilityCode={facilityCode} onClose={()=>setSelected(null)} onUpdated={()=>setSelected(null)} onDeleted={()=>setSelected(null)} showToast={showToast}/>}
      {showDisposal&&<DisposalModal items={selectedItems} facilityCode={facilityCode} onClose={()=>setShowDisposal(false)} onDone={()=>{setShowDisposal(false);setSelectedIds(new Set());}} showToast={showToast}/>}
      {showDeleteBulk&&<DeleteBulkModal items={selectedItems} facilityCode={facilityCode} onClose={()=>setShowDeleteBulk(false)} onDone={()=>{setShowDeleteBulk(false);setSelectedIds(new Set());}} showToast={showToast}/>}
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

/* ══════════════════════════════════════════
   11. 루트 앱
══════════════════════════════════════════ */
function App(){
  const [facilityCode,setFacilityCode]=useState(()=>localStorage.getItem("facilityCode")||null);
  const [facilityName,setFacilityName]=useState(()=>localStorage.getItem("facilityName")||"");

  const handleEnter=(code,name)=>{ setFacilityCode(code); setFacilityName(name); };
  const handleLogout=()=>{ setFacilityCode(null); setFacilityName(""); };

  if(!facilityCode) return <GatePage onEnter={handleEnter}/>;
  return <Dashboard facilityCode={facilityCode} facilityName={facilityName} onLogout={handleLogout}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
